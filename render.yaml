services:
  - type: web
    name: aiman-collection-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node apps/api/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
    healthCheckPath: /api/health
